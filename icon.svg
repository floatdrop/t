<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="t">
  <title>t</title>

  <!-- Rounded tile in the app's own background colour, so the icon reads the
       same on a light or dark page without needing two variants. -->
  <rect width="64" height="64" rx="15" fill="#12151d"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="none"
        stroke="#242a38"/>

  <!-- The "t", drawn as strokes rather than <text>: an icon must not depend
       on a font being installed wherever it is rendered. -->
  <g fill="none" stroke="#5b8cff" stroke-width="5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 17V41q0 6 6 6"/>
    <path d="M19 27h16"/>
  </g>

  <!-- The period is the live dot: same green as the speaking indicator, so
       the mark says "a call is happening" rather than just spelling a letter. -->
  <circle cx="42.5" cy="44" r="3.5" fill="#3ecf8e"/>
</svg>
